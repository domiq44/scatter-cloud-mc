name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang-format clang-tidy cppcheck

      - name: Run quality checks
        run: make quality

      - name: Build and run tests
        run: make build test